<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Kaban — Personal Money Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3F0;--card:#fff;--ink:#12202E;--mut:#66727F;--line:#E1E4E0;--jade:#1E6F5C;--brass:#B58A3E;--rose:#A8433B;--hero:#12202E;--herot:#F4EFE3;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);color-scheme:light}
:root:not([data-theme=light]){}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D141C;--card:#16212D;--ink:#E9ECEA;--mut:#93A0AC;--line:#263443;--jade:#4BB89C;--brass:#D5AE62;--rose:#E0776D;--hero:#1B2A3A;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0D141C;--card:#16212D;--ink:#E9ECEA;--mut:#93A0AC;--line:#263443;--jade:#4BB89C;--brass:#D5AE62;--rose:#E0776D;--hero:#1B2A3A;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,system-ui,sans-serif;padding-top:var(--safe-t);padding-bottom:calc(76px + var(--safe-b))}
main{max-width:760px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0}h2{font-size:17px;margin:22px 0 10px}h3{font-size:15px}
.num{font-family:Newsreader,Georgia,serif;font-weight:600;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.top .brand{font:600 22px Newsreader,serif}.mut{color:var(--mut);font-size:13px}
.hero{background:var(--hero);color:var(--herot);border-radius:20px;padding:22px}.hero .big{font-size:44px;line-height:1.05;margin:4px 0 14px}
.hero .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hero .row div{font-size:12px;opacity:.85}.hero .row b{display:block;font:600 16px Newsreader,serif;opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.grid.g2{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:7px 0 4px}.bar i{display:block;height:100%;background:var(--jade);border-radius:9px}
.warn i{background:var(--brass)}.over i{background:var(--rose)}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--line)}.pill.ok{color:var(--jade)}.pill.w{color:var(--brass)}.pill.o{color:var(--rose)}
.pos{color:var(--jade)}.neg{color:var(--rose)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font:600 12px Manrope;padding:8px 2px;cursor:pointer;border-radius:10px}nav button.on{color:var(--jade);background:var(--bg)}
.fab{position:fixed;right:16px;bottom:calc(84px + var(--safe-b));background:var(--jade);color:#fff;border:0;border-radius:99px;padding:14px 20px;font:700 15px Manrope;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6;cursor:pointer}
button,input,select{font:inherit;color:inherit}input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 10px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.seg button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;cursor:pointer}.seg button.on{background:var(--ink);color:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(5,10,16,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--safe-b))}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + var(--safe-t));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:90%}
.tx{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mut);font:11px Manrope}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
.gate nav,.gate .fab{display:none}
</style></head><body class="gate"><main id="app"></main>
<button class="fab" onclick="openForm()">+ Quick add</button>
<nav id="nav"></nav><div id="ov"></div>
<script>
const _d=new Date(),P2=n=>String(n).padStart(2,'0'),TODAY=_d.getFullYear()+'-'+P2(_d.getMonth()+1)+'-'+P2(_d.getDate()),CM=TODAY.slice(0,7),MS=[5,4,3,2,1,0].map(i=>{const x=new Date(_d.getFullYear(),_d.getMonth()-i,1);return x.getFullYear()+'-'+P2(x.getMonth()+1)});
const MN=m=>['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m.slice(5)];
const CATS=['Food','Groceries','Transportation','Fuel','Utilities','Rent / Housing','School / Education','Healthcare','Shopping','Entertainment','Subscriptions','Family','Personal','Insurance','Business','Debt Payment','Savings','Other'];
const INC=['Salary','Freelance','Business','Commission','Side Hustle','Allowance','Investment Income','Other'];
const TYPES={exp:'Expense',inc:'Income',sav:'Savings',debt:'Debt payment',xfer:'Transfer'};
function seed(){
 const A=[{id:'cash',n:'Cash Wallet',t:'Cash',o:4500},{id:'bdo',n:'BDO Payroll',t:'Bank',o:61000},{id:'gc',n:'GCash',t:'E-wallet',o:3200},{id:'sv',n:'BPI Savings',t:'Savings',o:20000},{id:'cc',n:'Metrobank Credit Card',t:'Credit',o:-8000}];
 const D=[{id:'car',n:'Car loan',cred:'BDO Auto',orig:480000,b0:312000,rate:9.5,min:9500,due:15},{id:'pl',n:'Personal loan',cred:'Metrobank',orig:120000,b0:74000,rate:14,min:3500,due:16},{id:'fr',n:'Loan from a friend',cred:'Family/Friend',orig:20000,b0:12000,rate:0,min:2000,due:30}];
 const G=[{id:'g1',n:'Emergency Fund',cat:'Emergency Fund',target:180000,b0:45000,date:'2027-06-30'},{id:'g2',n:'Japan trip',cat:'Vacation',target:80000,b0:12000,date:'2027-03-31'},{id:'g3',n:'House down payment',cat:'House',target:500000,b0:60000,date:'2029-12-31'}];
 const B=[['Food',10000],['Groceries',9000],['Transportation',5000],['Utilities',8000],['Shopping',3000],['Entertainment',2000],['Subscriptions',1000],['Healthcare',2500]].map(x=>({cat:x[0],lim:x[1]}));
 const bills=[['b1','Condo rent',18000,1,'Rent / Housing'],['b2','Meralco electricity',4200,8,'Utilities'],['b3','PLDT Fibr',1699,9,'Utilities'],['b4','Car loan',9500,15,'Debt Payment'],['b5','Personal loan',3500,16,'Debt Payment'],['b6','Netflix & Spotify',749,3,'Subscriptions'],['b7','Water',1100,27,'Utilities'],['b8','Insurance premium',2850,30,'Insurance'],['b9','School fees',6500,28,'School / Education']].map(x=>({id:x[0],n:x[1],amt:x[2],due:x[3],cat:x[4]}));
 const T=[];let k=0;const r=()=>((++k*9301+49297)%233280)/233280;
 const add=(m,d,desc,cat,amt,acct,type,e,to,b)=>{if(d<=(m===CM?+TODAY.slice(8):28))T.push({id:'t'+T.length,date:m+'-'+String(d).padStart(2,'0'),desc,cat,amt:Math.round(amt),acct,type,ess:e,to,b})};
 MS.forEach(m=>{
  add(m,1,'Condo rent','Rent / Housing',18000,'bdo','exp',1,0,'b1');add(m,5,'Salary','Salary',36000,'bdo','inc');add(m,20,'Salary','Salary',36000,'bdo','inc');
  add(m,12,'Freelance project','Freelance',9000+r()*6000,'gc','inc');add(m,8,'Meralco','Utilities',3600+r()*1200,'bdo','exp',1,0,'b2');add(m,9,'PLDT Fibr','Utilities',1699,'bdo','exp',1,0,'b3');
  add(m,3,'Netflix & Spotify','Subscriptions',749+(m>'2026-08'?250:0),'cc','exp',0,0,'b6');add(m,15,'Car loan','Debt Payment',9500,'bdo','debt',1,'car','b4');add(m,16,'Personal loan','Debt Payment',3500,'bdo','debt',1,'pl','b5');
  add(m,21,'Emergency fund','Savings',8000,'bdo','sav',1,'g1');add(m,22,'Japan trip fund','Savings',3000,'bdo','sav',1,'g2');add(m,23,'Credit card payment','Transfer',6000,'bdo','xfer',0,'cc');
  [4,11,18,24].forEach(d=>add(m,d,'SM Supermarket','Groceries',1700+r()*900,'bdo','exp',1));
  [2,6,10,14,19,23].forEach(d=>add(m,d,['Jollibee','Coffee','Lunch','Dinner with family'][d%4],'Food',160+r()*(m===CM?650:380),'gc','exp',d%3?1:0));
  for(let d=1;d<=28;d+=3)add(m,d,'Grab / commute','Transportation',90+r()*210,'cash','exp',1);
  [7,20].forEach(d=>add(m,d,'Fuel','Fuel',1500+r()*400,'cc','exp',1));add(m,17,'Shopee order','Shopping',1200+r()*1900,'cc','exp',0);add(m,13,'Pharmacy','Healthcare',500+r()*900,'cash','exp',1);add(m,26,'Cinema','Entertainment',600+r()*500,'gc','exp',0);
 });
 return{sym:'₱',A,D,G,B,bills,T,rec:[],strat:'avalanche',daily:1500,monthly:55000,notif:{bills:1,budget:1,debt:1,goals:1}};
}
const CUR={PHP:['₱',10,'en-PH'],USD:['$',1,'en-US'],EUR:['€',1,'en-IE'],GBP:['£',1,'en-GB'],JPY:['¥',150,'ja-JP'],SGD:['S$',1.5,'en-SG']};
const price=()=>{const c=CUR[(S&&S.cur)||'PHP'];return c[0]+c[1]};
function blank(){return{cur:'PHP',A:[{id:'cash',n:'Cash Wallet',t:'Cash',o:0},{id:'bdo',n:'Main Bank Account',t:'Bank',o:0},{id:'sv',n:'Savings Account',t:'Savings',o:0},{id:'cc',n:'Credit Card',t:'Credit',o:0}],D:[],G:[{id:'g1',n:'Emergency Fund',cat:'Emergency Fund',target:100000,b0:0,date:'2027-12-31'}],B:[],bills:[],T:[],rec:[],strat:'avalanche',daily:1000,monthly:30000,notif:{bills:1,budget:1,debt:1,goals:1}}}
function newData(){const b=blank();b.cur=acct().cur||'PHP';return b}
const ls={g:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S,ME=null,EMAIL='';
function load(){S=ls.g('kaban_d_'+ME)||newData();S.rec=S.rec||[];runRec()}
let svT;const save=()=>{if(!ME||!window.FB)return;clearTimeout(svT);svT=setTimeout(()=>FB.save(S),600)};
const f=n=>{const c=CUR[S.cur||'PHP'],a=Math.abs(n);return(n<0?'−':'')+c[0]+a.toLocaleString(c[2],{maximumFractionDigits:c[0]!=='¥'&&a<100?2:0})};
const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
const inM=(m,t=S.T)=>t.filter(x=>x.date.startsWith(m));
const tot=(m,ty)=>sum(inM(m).filter(x=>x.type===ty),x=>x.amt);
function bal(a){let b=a.o;S.T.forEach(t=>{if(t.acct===a.id)b+=t.type==='inc'?t.amt:-t.amt;if(t.type==='xfer'&&t.to===a.id)b+=t.amt;if(t.type==='sav'&&a.id==='sv')b+=t.amt});return b}
const debtBal=d=>Math.max(0,d.b0-sum(S.T.filter(t=>t.type==='debt'&&t.to===d.id),t=>t.amt));
const goalAmt=g=>g.b0+sum(S.T.filter(t=>t.type==='sav'&&t.to===g.id),t=>t.amt);
const cash=()=>sum(S.A.filter(a=>['Cash','Bank','E-wallet'].includes(a.t)),bal);
const cardOwed=()=>Math.max(0,-bal(S.A.find(a=>a.id==='cc')));
const loans=()=>sum(S.D,debtBal),totDebt=()=>loans()+cardOwed();
const OTHER=505000;
const netWorth=()=>sum(S.A.filter(a=>a.t!=='Credit'),bal)+OTHER-totDebt();
const spent=(m,c)=>sum(inM(m).filter(x=>x.type==='exp'&&(!c||x.cat===c)),x=>x.amt);
const pct=(a,b)=>b?Math.min(999,Math.round(a/b*100)):0;
const stat=p=>p>=100?['o','Over budget']:p>=80?['w','Approaching limit']:['ok','On track'];
function nextDue(b){const paid=S.T.some(t=>t.b===b.id&&t.date.startsWith(CM));const dd=b.due,day=+TODAY.slice(8);
 if(!paid&&dd>=day)return{d:CM+'-'+String(dd).padStart(2,'0'),n:dd-day,paid:0};if(!paid)return{d:'overdue',n:-1,paid:0};return{d:'next',n:30-day+dd,paid:1}}
function line(v,lab,col){const w=340,h=110,mx=Math.max(...v),mn=Math.min(...v),sp=(mx-mn)||1;const p=v.map((y,i)=>[20+i*(w-40)/(v.length-1),12+(h-34)*(1-(y-mn)/sp)]);
 return`<svg viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${col}" stroke-width="2.5" points="${p.map(x=>x.join(',')).join(' ')}"/>${p.map((x,i)=>`<circle cx="${x[0]}" cy="${x[1]}" r="3.5" fill="${col}"/><text x="${x[0]}" y="${h-4}" text-anchor="middle">${lab[i]}</text>`).join('')}</svg>`}
function bars(a,b,lab){const w=340,h=130,mx=Math.max(1,...a,...b);let s=`<svg viewBox="0 0 ${w} ${h}">`;a.forEach((v,i)=>{const x=14+i*54,H=(h-30)*v/mx,H2=(h-30)*b[i]/mx;s+=`<rect x="${x}" y="${h-20-H}" width="20" height="${H}" rx="4" fill="var(--jade)"/><rect x="${x+23}" y="${h-20-H2}" width="20" height="${H2}" rx="4" fill="var(--brass)"/><text x="${x+21}" y="${h-5}" text-anchor="middle">${lab[i]}</text>`});return s+'</svg>'}
const mEnd=m=>m+'-31',after=m=>S.T.filter(t=>t.date>mEnd(m));
let V='dash',SUB='',Q='',FT='',FC='',toastT;
const NAV=[['dash','Dashboard'],['tx','Transactions'],['bud','Budget'],['goals','Goals'],['more','More']];
function toast(m){clearTimeout(toastT);let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.append(e)}e.textContent=m;e.style.display='block';toastT=setTimeout(()=>e.style.display='none',3200)}
function dash(){const inc=tot(CM,'income'.slice(0,3)),exp=spent(CM),ess=sum(inM(CM).filter(x=>x.type==='exp'&&x.ess),x=>x.amt),sav=tot(CM,'sav'),dp=tot(CM,'debt'),pm=MS[4];
 const ob=S.monthly,op=pct(exp,ob),td=sum(inM(TODAY.slice(0,10)).filter(x=>x.date===TODAY&&x.type==='exp'),x=>x.amt);
 const cats=CATS.map(c=>[c,spent(CM,c)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6);const cm=cats[0]?cats[0][1]:1;
 const bl=S.bills.map(b=>({b,...nextDue(b)})).filter(x=>!x.paid).sort((a,b)=>a.n-b.n);
 const gt=S.G.map(g=>goalAmt(g)),dh=MS.map(m=>loans()+sum(after(m).filter(t=>t.type==='debt'),t=>t.amt));
 const sh=MS.map(m=>sum(S.G,goalAmt)-sum(after(m).filter(t=>t.type==='sav'),t=>t.amt));
 return`<div class="top"><div class="brand">Kaban</div><span class="mut">${MN(CM)} ${CM.slice(0,4)}</span></div>
 <div class="hero"><div class="mut" style="color:inherit;opacity:.8">Available cash — safe to spend</div><div class="num big">${f(cash())}</div>
 <div class="row"><div>Income<b>${f(inc)}</b></div><div>Expenses<b>${f(exp)}</b></div><div>Saved<b>${f(sav)}</b></div><div>Debt paid<b>${f(dp)}</b></div></div></div>
 <div class="grid" style="margin-top:12px"><div class="card"><div class="mut">Total savings</div><div class="num" style="font-size:24px">${f(sum(S.G,goalAmt))}</div></div><div class="card"><div class="mut">Total debt</div><div class="num neg" style="font-size:24px">${f(totDebt())}</div></div></div>
 <div class="card"><div class="row"><h3>Month budget</h3><span class="pill ${stat(op)[0]}">${stat(op)[1]}</span></div><div class="bar ${stat(op)[0]==='w'?'warn':stat(op)[0]==='o'?'over':''}"><i style="width:${Math.min(op,100)}%"></i></div><div class="mut">${f(exp)} of ${f(ob)} · ${op}% used · today ${f(td)} of ${f(S.daily)} daily limit</div></div>
 <div class="card"><h3>Money flow this month</h3><div class="mut" style="margin:6px 0">Income ${f(inc)} → Essentials ${f(ess)} → Non-essentials ${f(exp-ess)} → Saved ${f(sav)} → Debt ${f(dp)}</div><div class="num ${inc-exp-sav-dp>=0?'pos':'neg'}" style="font-size:22px">${f(inc-exp-sav-dp)} <span class="mut" style="font-family:Manrope;font-size:13px">left after everything</span></div></div>
 <h2>Income vs. expenses</h2><div class="card">${bars(MS.map(m=>tot(m,'inc')),MS.map(m=>spent(m)),MS.map(MN))}<div class="mut">Jade: income · Brass: expenses</div></div>
 <h2>Where it goes</h2><div class="card">${cats.map(c=>`<div class="row"><span>${c[0]}</span><b>${f(c[1])}</b></div><div class="bar"><i style="width:${c[1]/cm*100}%"></i></div>`).join('')}</div>
 <h2>Upcoming bills</h2><div class="card">${bl.slice(0,4).map(x=>`<div class="row" style="padding:5px 0"><span>${x.b.n}<br><span class="mut">${x.n<0?'Overdue':x.n===0?'Due today':'Due in '+x.n+' days'}</span></span><b>${f(x.b.amt)}</b></div>`).join('')||'<span class="mut">All bills paid.</span>'}</div>
 <div class="grid g2"><div class="card"><h3>Savings growth</h3>${line(sh,MS.map(MN),'var(--jade)')}</div><div class="card"><h3>Loan balance</h3>${line(dh,MS.map(MN),'var(--rose)')}</div></div>
 <h2>Insights</h2><div class="card">${insights(pm).map(x=>`<p style="margin:6px 0">${x}</p>`).join('')}<div class="mut">Based only on your recorded data. Estimates are not guarantees or professional advice.</div></div>
 <h2>Financial health</h2>${health(inc,exp,sav,dp)}`}
function insights(pm){const o=[],fd=spent(CM,'Food'),fp=spent(pm,'Food');if(fp)o.push(`Food spending is ${Math.abs(Math.round((fd-fp)/fp*100))}% ${fd>=fp?'higher':'lower'} than last month (to date).`);
 const sb=spent(CM,'Subscriptions'),sp=spent(pm,'Subscriptions');if(sb>sp)o.push('You are spending more on subscriptions than last month.');
 const wk=sum(S.bills.map(b=>({b,...nextDue(b)})).filter(x=>!x.paid&&x.n>=0&&x.n<=7),x=>x.b.amt);o.push(`You have ${f(wk)} in bills due in the next 7 days.`);
 const inc=tot(CM,'inc');o.push(`Your savings rate this month is ${pct(tot(CM,'sav'),inc)}%.`);
 const g=S.G[0],mo=tot(CM,'sav')?sum(S.T.filter(t=>t.to===g.id&&t.date.startsWith(CM)),t=>t.amt):0;if(mo){const n=Math.ceil((g.target-goalAmt(g))/mo);o.push(`At ${f(mo)} a month, you may reach your Emergency Fund goal in about ${n} months.`)}return o}
function health(inc,exp,sav,dp){inc=inc||1;const bw=S.B.filter(b=>spent(CM,b.cat)<b.lim).length/(S.B.length||1),g=goalAmt(S.G[0])/S.G[0].target,
 F=[['Spending vs. income',Math.max(0,1-exp/inc)*2],['Savings rate',sav/inc*4],['Emergency fund',g*1.4],['Debt-to-income',1-dp/inc/.5],['Budget adherence',bw],['Cash-flow stability',inc>exp?1:0.3]].map(x=>[x[0],Math.round(Math.max(0,Math.min(1,x[1]))*100)]);
 const sc=Math.round(sum(F,x=>x[1])/F.length);return`<div class="card"><div class="num" style="font-size:36px">${sc}<span class="mut" style="font-size:15px"> / 100</span></div>${F.map(x=>`<div class="row"><span class="mut">${x[0]}</span><span>${x[1]}</span></div><div class="bar ${x[1]<40?'over':x[1]<70?'warn':''}"><i style="width:${x[1]}%"></i></div>`).join('')}<div class="mut">A simple guide from your own numbers, not a professional assessment.</div></div>`}
function txv(){let l=[...S.T].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));const q=Q.toLowerCase();l=l.filter(t=>(!q||(t.desc+t.cat+t.amt).toLowerCase().includes(q))&&(!FT||t.type===FT)&&(!FC||t.cat===FC));
 return`<h2 style="margin-top:4px">Transactions</h2><input placeholder="Search description, category, amount" value="${Q}" oninput="Q=this.value;rs()" id="q"><div class="grid"><select onchange="FT=this.value;R()"><option value="">All types</option>${Object.entries(TYPES).map(e=>`<option value="${e[0]}" ${FT===e[0]?'selected':''}>${e[1]}</option>`).join('')}</select><select onchange="FC=this.value;R()"><option value="">All categories</option>${[...INC,...CATS].filter((x,i,a)=>a.indexOf(x)===i).map(c=>`<option ${FC===c?'selected':''}>${c}</option>`).join('')}</select></div>
 <div class="card" id="txl">${txl(l)}</div>`}

 else if(SUB==='nw'){const nw=netWorth(),v=MS.map(m=>nw-sum(after(m).filter(t=>t.type==='inc'||t.type==='exp'),t=>t.type==='inc'?t.amt:-t.amt));

 else if(SUB==='cal')h+=cal();else if(SUB==='rec')h+=recv();else if(SUB==='rep'){const L=MS[4],i=tot(CM,'inc'),e=spent(CM),s=tot(CM,'sav'),d=tot(CM,'debt');h+=`<div class="card"><h3>${MN(CM)} summary</h3>${[['Income',i],['Expenses',e],['Savings',s],['Debt payments',d],['Net cash flow',i-e-s-d]].map(x=>`<div class="row" style="padding:4px 0"><span>${x[0]}</span><b>${f(x[1])}</b></div>`).join('')}<div class="mut">Budget used ${pct(e,S.monthly)}% · last month spending ${f(spent(L))}</div></div><button class="btn" onclick="csv()">Export all transactions (CSV)</button> <button class="btn s" onclick="window.print()">Print / save PDF</button>`}
 else if(SUB==='set')h+=`<div class="card"><div class="row"><span><b>${EMAIL}</b><br><span class="mut">${planTxt()}</span></span><button class="btn s sm" onclick="out()">Sign out</button></div>${acct().plan==='Paid'&&(acct().paidUntil||'')>=TODAY?'<div class="mut" style="margin:12px 0">Subscription active until '+acct().paidUntil+'.</div>':(S.cur||'PHP')!=='PHP'?`<div style="margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:12px"><b>Pay ${price()} per month with PayPal</b><div class="num" style="font-size:18px;margin:4px 0;word-break:break-all">hiasminepadelgani@gmail.com</div><div class="mut" style="margin-bottom:8px">Send ${price()} in ${S.cur} to this PayPal account. Put your Kaban account email in the note, then enter the PayPal transaction ID below.</div><input id="gref" placeholder="PayPal transaction ID" value="${acct().ref||''}"><button class="btn sm" onclick="payRef()">${acct().plan==='Pending'?'Update reference':'Submit payment'}</button>${acct().plan==='Pending'?'<div class="mut" style="margin-top:6px">Payment submitted. Your plan activates once it is confirmed.</div>':''}</div>`:`<div style="margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:12px"><b>Pay ₱10 with GCash</b><div class="num" style="font-size:22px;margin:4px 0">0917 905 2906</div><div class="mut" style="margin-bottom:8px">Send ₱10 per month to this GCash number. Put your account email in the message, then enter the GCash reference number below.</div><input id="gref" inputmode="numeric" placeholder="GCash reference number" value="${acct().ref||''}"><button class="btn sm" onclick="payRef()">${acct().plan==='Pending'?'Update reference':'Submit payment'}</button>${acct().plan==='Pending'?'<div class="mut" style="margin-top:6px">Payment submitted. Your plan activates once it is confirmed.</div>':''}</div>`}${EMAIL===ADMIN?'<button class="btn sm" style="margin-bottom:10px" onclick="adminOpen()">Review payments</button>':''}<label class="mut">Currency<select o
